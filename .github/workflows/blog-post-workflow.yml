name: Latest blog post workflow

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull in Tistory posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://mydailyrecordof.tistory.com/rss"
          max_post_count: 10
          comment_tag_name: "TECH-BLOG"
          user_agent: "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          accept_header: "text/xml"

          gh_token: ${{ secrets.BLOG_WORKFLOW_TOKEN }}
          committer_username: "egggbeee"
          committer_email: "cybermoleskine@naver.com"
          commit_message: "Update README with latest blog posts"
